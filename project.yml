name: StickyPresenter
options:
  bundleIdPrefix: com.leeo
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  # 기본 언어는 영어. 한국어는 `*.lproj/Localizable.strings` 로 얹는다.
  # (knownRegions 를 적지 않으면 xcodegen 이 lproj 디렉터리에서 알아서 채운다.)
  developmentLanguage: en

# 버전·빌드번호의 단일 소스 (→ Config/Version.xcconfig). DeployBar 가 배포할 때 그 파일을 고친다.
# 프로젝트 레벨 baseConfiguration 이라 앱·위젯 두 타겟이 같은 값을 쓴다.
# ⚠️ MARKETING_VERSION·CURRENT_PROJECT_VERSION 을 아래 타겟 settings 에 다시 넣지 말 것.
#    타겟 빌드 설정은 xcconfig 보다 우선해서, 넣는 순간 그 파일이 조용히 무시된다.
configFiles:
  Debug: Config/Version.xcconfig
  Release: Config/Version.xcconfig

packages:
  LeeoKit:
    url: https://github.com/M1zz/LeeoKit.git
    from: 2.6.0

targets:
  StickyPresenter:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: StickyPresenter
        excludes:
          - "*.entitlements"
      # 앱과 위젯이 함께 컴파일하는 App Group 공유 모델·저장소
      - path: Shared
    dependencies:
      - package: LeeoKit
      - target: WidgetExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leeo.StickyPresenter
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        INFOPLIST_FILE: StickyPresenter/Info.plist
        CODE_SIGN_ENTITLEMENTS: StickyPresenter/StickyPresenter.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QGAQ3AY3R3
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          COPY_PHASE_STRIP: NO

  WidgetExtension:
    type: app-extension
    platform: macOS
    # 앱 본체와 동일하게 유지할 것 — 익스텐션이 더 높으면 하위 macOS에서 위젯이 뜨지 않는다.
    deploymentTarget: "14.0"
    sources:
      - path: Widget
        excludes:
          - "Info.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leeo.StickyPresenter.Widget
        PRODUCT_NAME: WidgetExtension
        # 버전·빌드 번호는 여기 두지 않는다 → Config/Version.xcconfig (위 configFiles).
        # 임베드된 익스텐션은 컨테이너 앱과 버전이 같아야 App Store 검증을 통과하는데,
        # 두 타겟이 그 한 파일을 함께 읽으므로 어긋날 수 없다.
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: WidgetExtension.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QGAQ3AY3R3
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          COPY_PHASE_STRIP: NO

# 스킴을 명시하지 않으면 xcodegen 이 재생성할 때마다 xcshareddata 가 비워져
# `xcodebuild -scheme StickyPresenter` 가 "does not contain a scheme" 로 실패한다.
# (그동안은 Xcode 가 열릴 때 자동 생성해 준 추적되지 않는 파일에 의존하고 있었다)
schemes:
  StickyPresenter:
    build:
      targets:
        StickyPresenter: all
    run:
      config: Debug
    archive:
      config: Release
