name: StickyPresenterRemote
options:
  bundleIdPrefix: com.leeo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # 화면 문구는 Sources/{en,ko}.lproj/Localizable.strings (키는 한국어 원문). Mac 앱과 같은 방식이다.
  # .xcstrings 로 두면 xcodegen 이 그 언어를 knownRegions 에 넣지 않아 ko.lproj 가 빠진다.
  developmentLanguage: en

# 버전·빌드 번호의 단일 소스 — DeployBar 가 배포할 때 이 파일을 고친다.
configFiles:
  Debug: Config/Version.xcconfig
  Release: Config/Version.xcconfig

# 피드백 · 리뷰 요청 · 익명 통계 · 크래시 진단 · 원격 킬스위치. Mac 앱과 같은 패키지·버전 줄.
packages:
  LeeoKit:
    url: https://github.com/M1zz/LeeoKit.git
    from: 3.16.1

targets:
  StickyPresenterRemote:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Mac 앱과 **같은 파일**을 참조한다. 복사본을 두면 한쪽만 고쳤을 때
      # 디코딩이 조용히 깨지므로 반드시 원본을 공유할 것.
      - path: ../Shared/RemoteProtocol.swift
    dependencies:
      - package: LeeoKit
    # 피드백 · 통계 · 킬스위치가 쓰는 FeedbackHub CloudKit 컨테이너 (Mac 앱과 같은 컨테이너).
    entitlements:
      path: Sources/StickyPresenterRemote.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.Ysoup.FeedbackHub
        com.apple.developer.icloud-services:
          - CloudKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leeo.StickyPresenter.Remote
        # 서명 설정은 반드시 여기에 둘 것.
        # Xcode 에서 Signing & Capabilities 로 지정하면 생성된 pbxproj 에만 남아
        # 다음 `xcodegen generate` 때 사라진다.
        DEVELOPMENT_TEAM: QGAQ3AY3R3
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 버전·빌드 번호는 여기 두지 않는다 → Config/Version.xcconfig (위 configFiles).
        # 여기 다시 적으면 xcconfig 가 조용히 무시된다.
        SWIFT_VERSION: "5.0"
        # iPhone 전용(1). iPad(2)까지 넣으면 App Store 가 멀티태스킹을 위해
        # 네 방향을 모두 지원하라고 요구해 업로드가 거절된다.
        #   "you need to include all of the Portrait, PortraitUpsideDown,
        #    LandscapeLeft, LandscapeRight orientations to support iPad multitasking"
        # 이 앱은 한 손으로 쓰는 리모컨이라 세로 고정이 맞고, 화면 문구도 전부
        # iPhone 기준이다. iPad 에서는 호환 모드로 그대로 설치·실행된다.
        # iPad 를 정식 지원하려면 "1,2" 로 되돌리고 네 방향을 모두 열어야 한다.
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Sources/Info.plist
      properties:
        # 수출 규정: 운영체제 암호화(HTTPS 등)만 쓴다 — 심사 때 암호화 질문을 건너뛴다
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: Remote Controller
        # 값을 그대로 적으면 plist 쪽이 이겨서 위의 MARKETING_VERSION /
        # CURRENT_PROJECT_VERSION 이 무시된다. 버전은 한 곳에서만 관리한다.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSBonjourServices:
          - _sp-timer._tcp
          - _sp-timer._udp
        NSLocalNetworkUsageDescription: 같은 네트워크에 있는 Mac의 StickyPresenter를 찾아 타이머를 조작합니다.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

  # 순수 로직 단위 테스트. 앱을 호스트로 띄우지 않고 검사 대상 파일을 직접 컴파일한다 —
  # 앱을 띄우면 Mac 찾기(로컬 네트워크)까지 켜져 테스트가 느려지고 흔들린다.
  # 그래서 여기 넣는 파일은 UIKit 화면이나 LeeoKit 에 기대지 않아야 한다.
  StickyPresenterRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Sources/PendingCommands.swift
      - path: ../Shared/RemoteProtocol.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leeo.StickyPresenter.RemoteTests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: QGAQ3AY3R3
        CODE_SIGN_STYLE: Automatic

# 스킴을 적어 두지 않으면 xcodegen 이 재생성할 때마다 공유 스킴이 사라져
# `xcodebuild -scheme StickyPresenterRemote` 가 "does not contain a scheme" 로 실패한다.
schemes:
  StickyPresenterRemote:
    build:
      targets:
        StickyPresenterRemote: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StickyPresenterRemoteTests
    archive:
      config: Release
